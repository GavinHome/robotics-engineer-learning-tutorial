<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <style>
    @page { size: 297mm 210mm; margin: 0; }
    text { font-family: -apple-system, "PingFang SC", "Heiti SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .ts  { font-size: 3.0px; fill: #222; }
    .txs { font-size: 2.6px; fill: #555; }
    .tb  { font-size: 3.6px; fill: #000; font-weight: 700; }
  </style>

  <rect x="0" y="0" width="297" height="210" fill="#ffffff"/>

  <!-- ==================== 标题 ==================== -->
  <text class="tb" x="6" y="7.5">Day 35 巡线轨迹纸（A4 横放 297 × 210 mm，线宽 10 mm）</text>
  <text class="ts" x="6" y="12.5">打印：A4 / 缩放 100% / 边距“无” / 关“适应页面” / 勾“打印背景图形”。打完拿尺量线宽，应是 10 mm——量不对就是缩放错了。</text>
  <text class="ts" x="6" y="17.5">标定不在这张纸上：白底用一张空白 A4，黑底用《黑底标定-A4》。五路阵列展开约 75 mm，黑区必须比它大，所以单独印一张。</text>

  <!-- ==================== 轨迹：直道 + 90° 弯 + 出弯 ==================== -->
  <!-- 中心线：y=115 直行到 x=210，R20 四分之一圆右转，再直行 58 mm 到终点 -->
  <path d="M 5 115 L 210 115 A 20 20 0 0 1 230 135 L 230 193"
        fill="none" stroke="#000000" stroke-width="10" stroke-linecap="butt"/>

  <text class="tb" x="7" y="107">起点</text>

  <!-- 弯标注 -->
  <text class="ts" x="246" y="128">90° 弯（R20）</text>
  <text class="txs" x="246" y="132.5">开环没有积分项，弯里 pos 会</text>
  <text class="txs" x="246" y="137">一直同一个符号，车会一直</text>
  <text class="txs" x="246" y="141.5">打方向直到看不见线</text>

  <text class="ts" x="238" y="189">终点</text>
  <text class="txs" x="238" y="194">用手/白纸接住，别冲下桌</text>

  <!-- ==================== 尺子：丢线位置记这里 ==================== -->
  <g stroke="#000" stroke-width="0.2">
    <line x1="5"   y1="121" x2="5"   y2="124"/>
    <line x1="15"  y1="121" x2="15"  y2="123"/>
    <line x1="25"  y1="121" x2="25"  y2="123"/>
    <line x1="35"  y1="121" x2="35"  y2="123"/>
    <line x1="45"  y1="121" x2="45"  y2="123"/>
    <line x1="55"  y1="121" x2="55"  y2="125.5"/>
    <line x1="65"  y1="121" x2="65"  y2="123"/>
    <line x1="75"  y1="121" x2="75"  y2="123"/>
    <line x1="85"  y1="121" x2="85"  y2="123"/>
    <line x1="95"  y1="121" x2="95"  y2="123"/>
    <line x1="105" y1="121" x2="105" y2="125.5"/>
    <line x1="115" y1="121" x2="115" y2="123"/>
    <line x1="125" y1="121" x2="125" y2="123"/>
    <line x1="135" y1="121" x2="135" y2="123"/>
    <line x1="145" y1="121" x2="145" y2="123"/>
    <line x1="155" y1="121" x2="155" y2="125.5"/>
    <line x1="165" y1="121" x2="165" y2="123"/>
    <line x1="175" y1="121" x2="175" y2="123"/>
    <line x1="185" y1="121" x2="185" y2="123"/>
    <line x1="195" y1="121" x2="195" y2="123"/>
    <line x1="205" y1="121" x2="205" y2="125.5"/>
  </g>
  <g class="txs" text-anchor="middle">
    <text x="5"   y="130">0</text>
    <text x="55"  y="130">5</text>
    <text x="105" y="130">10</text>
    <text x="155" y="130">15</text>
    <text x="205" y="130">20</text>
  </g>
  <text class="txs" x="5" y="134.5">尺子（单位 cm，0 = 起点）：直道上丢线的位置记这里的数字</text>

  <!-- ==================== 今天的考点 ==================== -->
  <text class="tb" x="6" y="145">今天的考点（Day 35 开环：三档固定 duty，没有比例项）</text>
  <text class="ts" x="6" y="150">· 直道：能不能一直跟住；丢线丢在哪——记尺子 cm 数 + 当时 pos + 五路 DO 组合</text>
  <text class="ts" x="6" y="155">· 90° 弯：入弯前丢 = 巡航 duty 太大冲过去；弯心丢 = 慢速档太慢；出弯后丢 = 恢复太慢</text>
  <text class="ts" x="6" y="160">· 到线附近来回摆：数一秒摆几个来回——这个数是 Day 36 选 Kp 的起点</text>
  <text class="ts" x="6" y="165">· 车往一边偏 = 两个 TT 马达不一样快：记偏的方向和 TRIM_RIGHT 补多少（串口 +/- 能试）</text>
  <text class="txs" x="6" y="171">纸四角用书本或胶带压住，别让车推着纸跑。直道不够长：打印两份沿长边对接、线对线粘，接缝处车可能顿一下。</text>
  <text class="txs" x="6" y="175.5">别把线涂成一大片：黑线宽过 6~7 cm（五路全压黑）会触发“全黑丢线”直接刹停。10 mm 是安全宽度。</text>
  <text class="txs" x="6" y="180">打印黑吸红外弱（raw 约 2000~3000）：b 就用黑底标定纸的黑标定；有条件用黑色笔 / 染料沿线描一遍，读数更高、余量更大。</text>

  <!-- ==================== 标定验收线 ==================== -->
  <text class="tb" x="6" y="187">上线前的验收（不达标别测轨迹）</text>
  <text class="ts" x="6" y="192">w 表：五路白底相差 &lt;400 码、每路量程 &gt;1000；t 表：散布 &lt;200、判定全 OK、“已分开”。</text>
  <text class="ts" x="6" y="197">t 表任何一路“永远报黑 / 永远报白 / 没扫到” = 电位器方向或黑区不够大，先修再跑。</text>

</svg>
