<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290">
  <!-- 背景 -->
  <rect width="660" height="290" fill="#1e1e1e"/>

  <!-- 电池 (5V)：长细线=正极，短粗线=负极 -->
  <line x1="60" y1="50" x2="60" y2="75" stroke="#ff4444" stroke-width="2"/>
  <line x1="45" y1="75" x2="75" y2="75" stroke="#ff4444" stroke-width="2"/>
  <line x1="52" y1="90" x2="68" y2="90" stroke="#888" stroke-width="4"/>
  <line x1="60" y1="90" x2="60" y2="260" stroke="#888" stroke-width="2"/>
  <text x="60" y="40" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">5V</text>

  <!-- 正极汇流线（干路，到最右支路抽头为止，不穿过任何元件） -->
  <line x1="60" y1="50" x2="480" y2="50" stroke="#ff4444" stroke-width="2"/>

  <!-- 干路电流箭头 I -->
  <line x1="75" y1="50" x2="90" y2="50" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="82" y="42" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">I</text>

  <!-- 支路 1：330Ω 限流电阻 + LED1 -->
  <line x1="120" y1="50" x2="120" y2="150" stroke="#ff4444" stroke-width="2"/>
  <line x1="120" y1="150" x2="140" y2="150" stroke="#ff4444" stroke-width="2"/>
  <rect x="140" y="143" width="60" height="14" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="170" y="136" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="11">330Ω</text>
  <line x1="200" y1="150" x2="220" y2="150" stroke="#ff4444" stroke-width="2"/>
  <polygon points="220,140 235,150 220,160" fill="#ff4444" stroke="#ff4444" stroke-width="1"/>
  <line x1="235" y1="140" x2="235" y2="160" stroke="#ff4444" stroke-width="2"/>
  <text x="228" y="130" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">LED1</text>
  <line x1="235" y1="150" x2="260" y2="150" stroke="#888" stroke-width="2"/>
  <line x1="260" y1="150" x2="260" y2="260" stroke="#888" stroke-width="2"/>

  <!-- 支路 1 电流箭头 I1（画在支路导线上） -->
  <line x1="120" y1="68" x2="120" y2="82" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="80" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">I1</text>

  <!-- 支路 2：330Ω 限流电阻 + LED2 -->
  <line x1="300" y1="50" x2="300" y2="150" stroke="#ff4444" stroke-width="2"/>
  <line x1="300" y1="150" x2="320" y2="150" stroke="#ff4444" stroke-width="2"/>
  <rect x="320" y="143" width="60" height="14" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="350" y="136" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="11">330Ω</text>
  <line x1="380" y1="150" x2="400" y2="150" stroke="#ff4444" stroke-width="2"/>
  <polygon points="400,140 415,150 400,160" fill="#ff4444" stroke="#ff4444" stroke-width="1"/>
  <line x1="415" y1="140" x2="415" y2="160" stroke="#ff4444" stroke-width="2"/>
  <text x="408" y="130" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">LED2</text>
  <line x1="415" y1="150" x2="440" y2="150" stroke="#888" stroke-width="2"/>
  <line x1="440" y1="150" x2="440" y2="260" stroke="#888" stroke-width="2"/>

  <!-- 支路 2 电流箭头 I2 -->
  <line x1="300" y1="68" x2="300" y2="82" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="80" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">I2</text>

  <!-- 支路 3：330Ω 限流电阻 + LED3 -->
  <line x1="480" y1="50" x2="480" y2="150" stroke="#ff4444" stroke-width="2"/>
  <line x1="480" y1="150" x2="500" y2="150" stroke="#ff4444" stroke-width="2"/>
  <rect x="500" y="143" width="60" height="14" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="530" y="136" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="11">330Ω</text>
  <line x1="560" y1="150" x2="580" y2="150" stroke="#ff4444" stroke-width="2"/>
  <polygon points="580,140 595,150 580,160" fill="#ff4444" stroke="#ff4444" stroke-width="1"/>
  <line x1="595" y1="140" x2="595" y2="160" stroke="#ff4444" stroke-width="2"/>
  <text x="588" y="130" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">LED3</text>
  <line x1="595" y1="150" x2="620" y2="150" stroke="#888" stroke-width="2"/>
  <line x1="620" y1="150" x2="620" y2="260" stroke="#888" stroke-width="2"/>

  <!-- 支路 3 电流箭头 I3 -->
  <line x1="480" y1="68" x2="480" y2="82" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="80" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">I3</text>

  <!-- 负极汇流线（干路，回到电池负极） -->
  <line x1="60" y1="260" x2="620" y2="260" stroke="#888" stroke-width="2"/>

  <!-- 并联节点圆点（正极抽头 / 负极汇合点） -->
  <circle cx="120" cy="50" r="3" fill="#ff4444"/>
  <circle cx="300" cy="50" r="3" fill="#ff4444"/>
  <circle cx="480" cy="50" r="3" fill="#ff4444"/>
  <circle cx="260" cy="260" r="3" fill="#888"/>
  <circle cx="440" cy="260" r="3" fill="#888"/>
  <circle cx="620" cy="260" r="3" fill="#888"/>

  <!-- 电压标注 -->
  <text x="170" y="175" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="10">Vr</text>
  <text x="350" y="175" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="10">Vr</text>
  <text x="530" y="175" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="10">Vr</text>
  <text x="227" y="175" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="10">Vled</text>
  <text x="407" y="175" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="10">Vled</text>
  <text x="587" y="175" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="10">Vled</text>

  <!-- 接地符号（挂在负极汇流线末端） -->
  <line x1="620" y1="260" x2="620" y2="268" stroke="#888" stroke-width="2"/>
  <line x1="608" y1="268" x2="632" y2="268" stroke="#888" stroke-width="2"/>
  <line x1="614" y1="274" x2="626" y2="274" stroke="#888" stroke-width="2"/>
  <line x1="618" y1="280" x2="622" y2="280" stroke="#888" stroke-width="2"/>

  <!-- 并联电路电流规律标注 -->
  <text x="330" y="278" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">I = I1 + I2 + I3</text>

  <!-- 图例（右上角，避开所有导线） -->
  <text x="585" y="18" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">图例</text>
  <line x1="575" y1="30" x2="595" y2="30" stroke="#ff4444" stroke-width="2"/>
  <text x="599" y="34" fill="#aaa" font-family="monospace" font-size="10">正极 (+)</text>
  <line x1="575" y1="50" x2="595" y2="50" stroke="#888" stroke-width="2"/>
  <text x="599" y="54" fill="#aaa" font-family="monospace" font-size="10">负极/地</text>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff"/>
    </marker>
  </defs>
</svg>
