<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- 背景 -->
  <rect width="500" height="300" fill="#1e1e1e"/>

  <!-- 中心节点 -->
  <circle cx="250" cy="150" r="6" fill="#fff"/>

  <!-- 支路 1（左上）：2mA 流入（红色=流入，箭头贴线指向节点） -->
  <line x1="150" y1="80" x2="250" y2="150" stroke="#ff4444" stroke-width="2"/>
  <line x1="80" y1="80" x2="150" y2="80" stroke="#ff4444" stroke-width="2"/>
  <line x1="170" y1="94" x2="185" y2="104" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="105" y="72" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">2mA</text>
  <text x="105" y="102" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">流入</text>

  <!-- 支路 2（右上）：3mA 流入（红色=流入，箭头贴线指向节点） -->
  <line x1="250" y1="150" x2="350" y2="80" stroke="#ff4444" stroke-width="2"/>
  <line x1="350" y1="80" x2="420" y2="80" stroke="#ff4444" stroke-width="2"/>
  <line x1="330" y1="94" x2="315" y2="104" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="72" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="12">3mA</text>
  <text x="395" y="102" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">流入</text>

  <!-- 支路 3（下方）：? mA 流出（灰色=流出，箭头贴线指向外） -->
  <line x1="250" y1="150" x2="250" y2="260" stroke="#888" stroke-width="2"/>
  <line x1="250" y1="178" x2="250" y2="192" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="200" text-anchor="start" fill="#aaa" font-family="monospace" font-size="12">? mA</text>
  <text x="280" y="214" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">流出</text>

  <!-- KCL 方程 -->
  <text x="250" y="290" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="14">KCL: 流入 = 流出 → 2 + 3 = ?</text>

  <!-- 图例 -->
  <text x="40" y="30" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">图例</text>
  <line x1="30" y1="42" x2="50" y2="42" stroke="#ff4444" stroke-width="2"/>
  <text x="55" y="46" fill="#aaa" font-family="monospace" font-size="10">流入</text>
  <line x1="30" y1="58" x2="50" y2="58" stroke="#888" stroke-width="2"/>
  <text x="55" y="62" fill="#aaa" font-family="monospace" font-size="10">流出</text>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff"/>
    </marker>
  </defs>
</svg>
