<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <!-- 背景 -->
  <rect width="720" height="300" fill="#1e1e1e"/>

  <!-- ============ 面板 ①：RC 充电电路 ============ -->
  <text x="185" y="28" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">① RC 充电电路</text>

  <!-- 电池 (5V) -->
  <line x1="100" y1="60" x2="100" y2="85" stroke="#ff4444" stroke-width="2"/>
  <line x1="85" y1="85" x2="115" y2="85" stroke="#ff4444" stroke-width="2"/>
  <line x1="92" y1="100" x2="108" y2="100" stroke="#888" stroke-width="4"/>
  <line x1="100" y1="100" x2="100" y2="250" stroke="#888" stroke-width="2"/>
  <text x="100" y="50" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">5V</text>

  <!-- 顶部导线 → RC 串联列 -->
  <line x1="100" y1="60" x2="220" y2="60" stroke="#ff4444" stroke-width="2"/>
  <line x1="150" y1="60" x2="168" y2="60" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="159" y="52" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">I</text>

  <!-- R (1kΩ) 竖直 -->
  <line x1="220" y1="60" x2="220" y2="90" stroke="#ff4444" stroke-width="2"/>
  <rect x="208" y="90" width="24" height="60" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="242" y="125" text-anchor="start" fill="#ffcc00" font-family="monospace" font-size="11">1kΩ</text>
  <line x1="220" y1="150" x2="220" y2="180" stroke="#ff4444" stroke-width="2"/>

  <!-- 电容 C (100µF)：两条平行极板 -->
  <line x1="200" y1="180" x2="240" y2="180" stroke="#fff" stroke-width="3"/>
  <line x1="200" y1="190" x2="240" y2="190" stroke="#fff" stroke-width="3"/>
  <text x="192" y="190" text-anchor="end" fill="#ffcc00" font-family="monospace" font-size="11">100µF</text>
  <line x1="220" y1="190" x2="220" y2="250" stroke="#888" stroke-width="2"/>

  <!-- Vc 标注（双向箭头） -->
  <line x1="258" y1="172" x2="258" y2="198" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="266" y1="198" x2="266" y2="172" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="190" text-anchor="start" fill="#ff6666" font-family="monospace" font-size="11">Vc</text>

  <!-- 底边导线 → 接地 -->
  <line x1="100" y1="250" x2="280" y2="250" stroke="#888" stroke-width="2"/>
  <line x1="280" y1="250" x2="280" y2="258" stroke="#888" stroke-width="2"/>
  <line x1="268" y1="258" x2="292" y2="258" stroke="#888" stroke-width="2"/>
  <line x1="274" y1="264" x2="286" y2="264" stroke="#888" stroke-width="2"/>
  <line x1="278" y1="270" x2="282" y2="270" stroke="#888" stroke-width="2"/>

  <!-- 提示 -->
  <text x="190" y="288" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="11">t = ?（τ = RC）</text>

  <!-- ============ 面板 ②：NPN 晶体管开关 ============ -->
  <text x="450" y="28" text-anchor="middle" fill="#fff" font-family="monospace" font-size="13">② NPN 开关：LED 亮吗？</text>

  <!-- 基极回路：3.3V 电池 → 10kΩ → 基极 -->
  <line x1="350" y1="190" x2="380" y2="190" stroke="#888" stroke-width="2"/>
  <line x1="380" y1="186" x2="380" y2="194" stroke="#888" stroke-width="4"/>
  <line x1="390" y1="182" x2="390" y2="198" stroke="#ff4444" stroke-width="2"/>
  <text x="385" y="168" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">3.3V</text>
  <line x1="390" y1="190" x2="420" y2="190" stroke="#ff4444" stroke-width="2"/>
  <rect x="420" y="183" width="60" height="14" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="450" y="176" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="11">10kΩ</text>
  <line x1="480" y1="190" x2="524" y2="190" stroke="#ff4444" stroke-width="2"/>
  <line x1="488" y1="190" x2="502" y2="190" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="496" y="206" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">Ib</text>

  <!-- 电池负端 → 底轨（共地） -->
  <line x1="350" y1="190" x2="350" y2="250" stroke="#888" stroke-width="2"/>

  <!-- NPN 晶体管符号（中性色） -->
  <circle cx="532" cy="190" r="28" fill="none" stroke="#ccc" stroke-width="1.5"/>
  <line x1="524" y1="172" x2="524" y2="208" stroke="#ccc" stroke-width="3"/>
  <line x1="524" y1="180" x2="556" y2="160" stroke="#ccc" stroke-width="2"/>
  <line x1="524" y1="200" x2="556" y2="220" stroke="#ccc" stroke-width="2"/>
  <line x1="538" y1="208" x2="548" y2="214" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 发射极 → 底轨 -->
  <line x1="556" y1="220" x2="556" y2="250" stroke="#888" stroke-width="2"/>
  <circle cx="556" cy="250" r="3" fill="#888"/>
  <text x="566" y="240" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">NPN</text>

  <!-- 集电极引线 → LED → 330Ω → Vcc（LED-集电极段加长） -->
  <line x1="556" y1="160" x2="556" y2="134" stroke="#888" stroke-width="2"/>
  <line x1="556" y1="144" x2="556" y2="156" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="154" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">Ic</text>
  <!-- LED（竖直，三角朝下=电流方向）+ 发光箭头 -->
  <polygon points="544,118 568,118 556,134" fill="#ff4444" stroke="#ff4444" stroke-width="1"/>
  <line x1="544" y1="134" x2="568" y2="134" stroke="#ff4444" stroke-width="2"/>
  <line x1="566" y1="122" x2="578" y2="114" stroke="#ffcc00" stroke-width="1.5" marker-end="url(#lightArrow)"/>
  <line x1="570" y1="130" x2="582" y2="122" stroke="#ffcc00" stroke-width="1.5" marker-end="url(#lightArrow)"/>
  <!-- LED 与 330Ω 之间的连接线 -->
  <line x1="556" y1="110" x2="556" y2="118" stroke="#ff4444" stroke-width="2"/>
  <!-- 330Ω 竖直 -->
  <rect x="544" y="62" width="24" height="48" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="578" y="80" text-anchor="start" fill="#ffcc00" font-family="monospace" font-size="11">330Ω</text>
  <!-- Vcc 端子 -->
  <line x1="556" y1="62" x2="556" y2="52" stroke="#ff4444" stroke-width="2"/>
  <circle cx="556" cy="48" r="3" fill="none" stroke="#ff4444" stroke-width="2"/>
  <text x="556" y="38" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="12">5V</text>

  <!-- 题目条件标注 -->
  <text x="600" y="195" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">Vbe≈0.7V</text>
  <text x="600" y="215" text-anchor="start" fill="#aaa" font-family="monospace" font-size="10">β=100</text>

  <!-- 底轨 → 接地 -->
  <line x1="350" y1="250" x2="620" y2="250" stroke="#888" stroke-width="2"/>
  <line x1="620" y1="250" x2="620" y2="258" stroke="#888" stroke-width="2"/>
  <line x1="608" y1="258" x2="632" y2="258" stroke="#888" stroke-width="2"/>
  <line x1="614" y1="264" x2="626" y2="264" stroke="#888" stroke-width="2"/>
  <line x1="618" y1="270" x2="622" y2="270" stroke="#888" stroke-width="2"/>

  <!-- 图例（右上角） -->
  <text x="668" y="18" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">图例</text>
  <line x1="640" y1="30" x2="658" y2="30" stroke="#ff4444" stroke-width="2"/>
  <text x="662" y="34" fill="#aaa" font-family="monospace" font-size="10">正极 (+)</text>
  <line x1="640" y1="50" x2="658" y2="50" stroke="#888" stroke-width="2"/>
  <text x="662" y="54" fill="#aaa" font-family="monospace" font-size="10">负极/地</text>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff"/>
    </marker>
    <marker id="lightArrow" markerWidth="6" markerHeight="5" refX="5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L5,2 z" fill="#ffcc00"/>
    </marker>
  </defs>
</svg>
