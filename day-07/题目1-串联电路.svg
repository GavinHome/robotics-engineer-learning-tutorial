<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <!-- 背景 -->
  <rect width="500" height="200" fill="#1e1e1e"/>

  <!-- 电池 (5V)：长细线=正极，短粗线=负极，两极板间留间隙 -->
  <line x1="60" y1="60" x2="60" y2="85" stroke="#ff4444" stroke-width="2"/>
  <line x1="45" y1="85" x2="75" y2="85" stroke="#ff4444" stroke-width="2"/>
  <line x1="52" y1="100" x2="68" y2="100" stroke="#888" stroke-width="4"/>
  <line x1="60" y1="100" x2="60" y2="170" stroke="#888" stroke-width="2"/>
  <text x="60" y="50" text-anchor="middle" fill="#fff" font-family="monospace" font-size="14">5V</text>

  <!-- 电池正极 → 电阻 的导线 -->
  <line x1="60" y1="60" x2="120" y2="60" stroke="#ff4444" stroke-width="2"/>

  <!-- 电阻 (1kΩ) -->
  <line x1="120" y1="60" x2="140" y2="60" stroke="#ff4444" stroke-width="2"/>
  <rect x="140" y="50" width="60" height="20" fill="none" stroke="#ffcc00" stroke-width="2"/>
  <text x="170" y="45" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="12">1kΩ</text>
  <line x1="200" y1="60" x2="240" y2="60" stroke="#ff4444" stroke-width="2"/>

  <!-- 导线 → LED 阳极 (+) -->
  <line x1="240" y1="60" x2="280" y2="60" stroke="#ff4444" stroke-width="2"/>

  <!-- LED（三角指向右=电流方向，右侧竖线=阴极） -->
  <polygon points="280,45 300,60 280,75" fill="#ff4444" stroke="#ff4444" stroke-width="1"/>
  <line x1="300" y1="45" x2="300" y2="75" stroke="#ff4444" stroke-width="2"/>
  <text x="272" y="54" text-anchor="middle" fill="#fff" font-family="monospace" font-size="12">+</text>
  <text x="310" y="78" text-anchor="start" fill="#fff" font-family="monospace" font-size="12">LED</text>

  <!-- LED 发光箭头 -->
  <line x1="288" y1="45" x2="300" y2="33" stroke="#ffcc00" stroke-width="1.5" marker-end="url(#lightArrow)"/>
  <line x1="294" y1="49" x2="306" y2="37" stroke="#ffcc00" stroke-width="1.5" marker-end="url(#lightArrow)"/>

  <!-- LED 阴极 → 回到电池负极（负极回路用灰色） -->
  <line x1="300" y1="60" x2="380" y2="60" stroke="#888" stroke-width="2"/>
  <line x1="380" y1="60" x2="380" y2="170" stroke="#888" stroke-width="2"/>

  <!-- 底边导线：电池负极 → LED 阴极侧，闭合回路 -->
  <line x1="60" y1="170" x2="380" y2="170" stroke="#888" stroke-width="2"/>
  <circle cx="380" cy="170" r="3" fill="#888"/>

  <!-- 接地符号（挂在回路节点上） -->
  <line x1="380" y1="170" x2="380" y2="178" stroke="#888" stroke-width="2"/>
  <line x1="368" y1="178" x2="392" y2="178" stroke="#888" stroke-width="2"/>
  <line x1="374" y1="184" x2="386" y2="184" stroke="#888" stroke-width="2"/>
  <line x1="378" y1="190" x2="382" y2="190" stroke="#888" stroke-width="2"/>

  <!-- 电流箭头（画在导线上） -->
  <line x1="88" y1="60" x2="100" y2="60" stroke="#fff" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="95" y="50" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">I</text>

  <!-- 电压标注 -->
  <text x="160" y="85" text-anchor="middle" fill="#ffcc00" font-family="monospace" font-size="11">Vr</text>
  <text x="290" y="85" text-anchor="middle" fill="#ff6666" font-family="monospace" font-size="11">Vled</text>

  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fff"/>
    </marker>
    <marker id="lightArrow" markerWidth="6" markerHeight="5" refX="5" refY="2" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,4 L5,2 z" fill="#ffcc00"/>
    </marker>
  </defs>

  <!-- 图例 -->
  <text x="420" y="30" text-anchor="middle" fill="#aaa" font-family="monospace" font-size="10">图例</text>
  <line x1="420" y1="40" x2="440" y2="40" stroke="#ff4444" stroke-width="2"/>
  <text x="445" y="44" fill="#aaa" font-family="monospace" font-size="10">正极 (+)</text>
  <line x1="420" y1="55" x2="440" y2="55" stroke="#888" stroke-width="2"/>
  <text x="445" y="59" fill="#aaa" font-family="monospace" font-size="10">负极/地</text>
</svg>
