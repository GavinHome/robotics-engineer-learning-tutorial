<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    @page { size: 210mm 297mm; margin: 0; }
    text { font-family: -apple-system, "PingFang SC", "Heiti SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .ts  { font-size: 3.0px; fill: #222; }
    .txs { font-size: 2.6px; fill: #555; }
    .tb  { font-size: 3.6px; fill: #000; font-weight: 700; }
    .tw  { font-size: 3.2px; fill: #fff; }
    .twb { font-size: 4.0px; fill: #fff; font-weight: 700; }
  </style>

  <rect x="0" y="0" width="210" height="297" fill="#ffffff"/>

  <!-- ==================== 标题 ==================== -->
  <text class="tb" x="6" y="10">Day 33 五路循线测试纸（A4 = 210 x 297 mm，左右横移版 · 阵列竖排）</text>
  <text class="ts" x="6" y="15">前提：TCRT5000 x 5 必须排成竖直一列——阵列的长边要和纸的移动方向垂直，这是九格带能成立的唯一条件。</text>
  <text class="ts" x="6" y="19.5">间距 15 mm，阵列长 60 mm，2 号在中点、#0 在最上。模块固定不动，纸左右推。打印：A4 / 缩放 100% / 边距"无" / 关"适应页面"。</text>

  <!-- ==================== ①② 说明 ==================== -->
  <text class="tb" x="6" y="27">① 白底标定区（纸左边那条 28 mm 宽的竖白条，y 112~188）</text>
  <text class="ts" x="6" y="32">把纸左右推，让五颗全压进左边这片白里。阵列是一条竖线，在纸上只占很窄一段 x，很好对。</text>
  <text class="ts" x="6" y="37">串口按 c，保持 3 cm 高度、别动、别挡光，约 1 秒。按 w 看白底表：五路 raw 一般落在 1400~2200，路与路差几百是正常的。</text>
  <text class="ts" x="6" y="42">按 c 之前先确认五颗下方是这片白，不是桌面、不是垫子、不是格子线。</text>
  <text class="ts" x="6" y="47">白底会漂（Day 32 实测 3 分钟漂约 250）。重新上电、换纸、改高度，都要重按 c。</text>
  <text class="ts" x="6" y="52">激光打印的黑够黑；喷墨的黑发灰，② 区的 raw 可能到不了 4095，能用但不理想。</text>

  <text class="tb" x="6" y="60">② 全高黑块（纸右边那条 28 mm 宽的竖黑条，y 112~188）</text>
  <text class="ts" x="6" y="65">把纸左右推，让五颗全压进右边这片黑里：五路 raw 应该全是 4095，n 五路全 1.00，sum 约 5.00。</text>
  <text class="ts" x="6" y="70">只要有一路不是 4095，就是那一路的硬件问题（焊点 / 高度 / 模块），先查它。</text>

  <text class="tb" x="6" y="78">③ 阵列在哪 / ④ 扫场格带：见图。九格带沿横向排，每格黑条的上下偏移编码"线在哪"。</text>
  <text class="ts" x="6" y="83">阵列的长边（60 mm）必须和纸的移动方向垂直。若五颗仍是横着排的一排，纸就不能左右推——那种摆法请用竖版《五路测试纸-A4》。</text>

  <!-- ==================== ④ 扫场格带 ==================== -->
  <text class="tb" x="6" y="88">④ 扫场格带（9 格，每格 14 mm）</text>

  <!-- 横向浅灰格子：15 mm 一根，0 在阵列中点 -->
  <g stroke="#d9d9d9" stroke-width="0.2">
    <line x1="46" y1="105" x2="172" y2="105"/>
    <line x1="46" y1="120" x2="172" y2="120"/>
    <line x1="46" y1="135" x2="172" y2="135"/>
    <line x1="46" y1="165" x2="172" y2="165"/>
    <line x1="46" y1="180" x2="172" y2="180"/>
    <line x1="46" y1="195" x2="172" y2="195"/>
  </g>
  <line x1="46" y1="150" x2="172" y2="150" stroke="#9a9a9a" stroke-width="0.35"/>

  <!-- 竖排刻度（15 mm 一格，0 在阵列中点） -->
  <g class="txs" text-anchor="end">
    <text x="44" y="105.5">-3</text>
    <text x="44" y="120.5">-2</text>
    <text x="44" y="135.5">-1</text>
    <text x="44" y="150.5">0</text>
    <text x="44" y="165.5">+1</text>
    <text x="44" y="180.5">+2</text>
    <text x="44" y="195.5">+3</text>
  </g>

  <!-- 格带分隔线（9 格，每格 14 mm） -->
  <g stroke="#000000" stroke-width="0.15">
    <line x1="46"  y1="92" x2="46"  y2="210"/>
    <line x1="60"  y1="92" x2="60"  y2="210"/>
    <line x1="74"  y1="92" x2="74"  y2="210"/>
    <line x1="88"  y1="92" x2="88"  y2="210"/>
    <line x1="102" y1="92" x2="102" y2="210"/>
    <line x1="116" y1="92" x2="116" y2="210"/>
    <line x1="130" y1="92" x2="130" y2="210"/>
    <line x1="144" y1="92" x2="144" y2="210"/>
    <line x1="158" y1="92" x2="158" y2="210"/>
    <line x1="172" y1="92" x2="172" y2="210"/>
  </g>

  <!-- ① 白底标定区（左） -->
  <rect x="6" y="112" width="28" height="76" fill="#ffffff" stroke="#000" stroke-width="0.3"/>
  <text class="tb" x="20" y="108" text-anchor="middle">① 白底</text>
  <text class="ts" x="20" y="104" text-anchor="middle">标定按 c</text>
  <text class="ts" x="20" y="192" text-anchor="middle">五路全压白</text>
  <text class="txs" x="20" y="196" text-anchor="middle">约 1 秒</text>

  <!-- ② 全高黑块（右） -->
  <rect x="176" y="112" width="28" height="76" fill="#000000"/>
  <text class="tb" x="190" y="108" text-anchor="middle">② 全高黑块</text>
  <text class="ts" x="190" y="104" text-anchor="middle">五路全压黑</text>
  <text class="tw" x="190" y="146" text-anchor="middle">raw 全 4095</text>
  <text class="tw" x="190" y="151" text-anchor="middle">n 全 1.00</text>
  <text class="tw" x="190" y="156" text-anchor="middle">sum &#8776; 5.00</text>

  <!-- 纸移动方向 -->
  <g stroke="#000" stroke-width="0.35" fill="none">
    <line x1="50" y1="213" x2="168" y2="213"/>
    <path d="M 50 213 L 54 211.2 L 54 214.8 Z" fill="#000" stroke="none"/>
    <path d="M 168 213 L 164 211.2 L 164 214.8 Z" fill="#000" stroke="none"/>
  </g>
  <text class="txs" x="109" y="210" text-anchor="middle">纸左右移动</text>

  <!-- 九格带：一根黑条 + 上下标注 -->
  <rect x="48"  y="101"   width="10" height="8" fill="#000000"/>
  <text class="ts" x="53"  y="93" text-anchor="middle">-45 mm</text>
  <text class="txs" x="53" y="97" text-anchor="middle">(-3 格)</text>
  <text class="ts" x="53"  y="113" text-anchor="middle">超出阵列</text>
  <text class="txs" x="53" y="117" text-anchor="middle">可能丢线</text>

  <rect x="62"  y="116"  width="10" height="8" fill="#000000"/>
  <text class="ts" x="67"  y="108" text-anchor="middle">-30 mm</text>
  <text class="txs" x="67" y="112" text-anchor="middle">(-2 格)</text>
  <text class="ts" x="67"  y="128" text-anchor="middle">&#8776; -1000</text>
  <text class="txs" x="67" y="132" text-anchor="middle">红灯</text>

  <rect x="76"  y="131"  width="10" height="8" fill="#000000"/>
  <text class="ts" x="81"  y="123" text-anchor="middle">-15 mm</text>
  <text class="txs" x="81" y="127" text-anchor="middle">(-1 格)</text>
  <text class="ts" x="81"  y="143" text-anchor="middle">&#8776; -500</text>
  <text class="txs" x="81" y="147" text-anchor="middle">红灯</text>

  <rect x="90"  y="138.5" width="10" height="8" fill="#000000"/>
  <text class="ts" x="95"  y="130.5" text-anchor="middle">-7.5 mm</text>
  <text class="txs" x="95" y="134.5" text-anchor="middle">(-半格)</text>
  <text class="ts" x="95"  y="150.5" text-anchor="middle">&#8776; -250</text>
  <text class="txs" x="95" y="154.5" text-anchor="middle">红灯</text>

  <rect x="104" y="146"  width="10" height="8" fill="#000000"/>
  <text class="tb" x="109" y="138" text-anchor="middle">0</text>
  <text class="tb" x="109" y="142" text-anchor="middle">(正中)</text>
  <text class="ts" x="109" y="158" text-anchor="middle">&#8776; 0</text>
  <text class="txs" x="109" y="162" text-anchor="middle">绿灯</text>

  <rect x="118" y="153.5" width="10" height="8" fill="#000000"/>
  <text class="ts" x="123" y="145.5" text-anchor="middle">+7.5 mm</text>
  <text class="txs" x="123" y="149.5" text-anchor="middle">(+半格)</text>
  <text class="ts" x="123" y="165.5" text-anchor="middle">&#8776; +250</text>
  <text class="txs" x="123" y="169.5" text-anchor="middle">蓝灯</text>

  <rect x="132" y="161"  width="10" height="8" fill="#000000"/>
  <text class="ts" x="137" y="153" text-anchor="middle">+15 mm</text>
  <text class="txs" x="137" y="157" text-anchor="middle">(+1 格)</text>
  <text class="ts" x="137" y="173" text-anchor="middle">&#8776; +500</text>
  <text class="txs" x="137" y="177" text-anchor="middle">蓝灯</text>

  <rect x="146" y="176"  width="10" height="8" fill="#000000"/>
  <text class="ts" x="151" y="168" text-anchor="middle">+30 mm</text>
  <text class="txs" x="151" y="172" text-anchor="middle">(+2 格)</text>
  <text class="ts" x="151" y="188" text-anchor="middle">&#8776; +1000</text>
  <text class="txs" x="151" y="192" text-anchor="middle">蓝灯</text>

  <rect x="160" y="191"  width="10" height="8" fill="#000000"/>
  <text class="ts" x="165" y="183" text-anchor="middle">+45 mm</text>
  <text class="txs" x="165" y="187" text-anchor="middle">(+3 格)</text>
  <text class="ts" x="165" y="203" text-anchor="middle">超出阵列</text>
  <text class="txs" x="165" y="207" text-anchor="middle">可能丢线</text>

  <!-- ==================== ③ 阵列位置示意（全尺寸竖线） ==================== -->
  <line x1="50" y1="222" x2="50" y2="292" stroke="#000" stroke-width="0.3"/>
  <text class="tb" x="6" y="225">③ 阵列在哪</text>
  <text class="txs" x="6" y="230">全尺寸，这条竖线</text>
  <text class="txs" x="6" y="234">就是五路阵列</text>
  <g stroke="#000" stroke-width="0.35">
    <line x1="26" y1="240" x2="26" y2="290"/>
    <line x1="24.4" y1="240" x2="27.6" y2="240"/>
    <line x1="24.4" y1="252.5" x2="27.6" y2="252.5"/>
    <line x1="24.4" y1="265" x2="27.6" y2="265"/>
    <line x1="24.4" y1="277.5" x2="27.6" y2="277.5"/>
    <line x1="24.4" y1="290" x2="27.6" y2="290"/>
  </g>
  <text class="txs" x="30" y="241">#0 最上</text>
  <text class="txs" x="30" y="266">#2 中点</text>
  <text class="txs" x="30" y="291">#4 最下</text>
  <text class="txs" x="22" y="266" text-anchor="end">60 mm</text>

  <!-- ==================== 怎么用 ==================== -->
  <text class="tb" x="56" y="225">怎么用</text>
  <text class="ts" x="56" y="230">1. 推纸前先把 #2 对准 ④ 里那条深色 0 线（y = 150），之后只左右推、别上下动。</text>
  <text class="ts" x="56" y="235">2. 先左右挪纸，让"0（正中）"那格读出 pos 约 0 且绿灯亮——这时 2 号对上了纸的中线。</text>
  <text class="ts" x="56" y="240">3. 串口按 p 开曲线模式，再左右推纸：每进一格停 1 秒，记下 pos。格与格之间会闪白灯（丢线），正常。</text>
  <text class="ts" x="56" y="245">4. 拿记下的 9 个数对上面的标注：一格 = 500，上下对称、中间均匀就算过。</text>
  <text class="ts" x="56" y="250">5. 不对称 = 五路高度不一致或某路接线松；中间出平台 = 某两颗模块的间距和别处不同。</text>
  <text class="ts" x="56" y="255">6. 两端那两格（±45 mm）黑条已出了阵列，看丢线还是勉强读数——这边界就是 Day 34 的尺度。</text>
  <text class="ts" x="56" y="260">7. 彩灯：绿 = 居中 / 白 = 丢线 / 红 = 偏 #0（上）/ 蓝 = 偏 #4（下）。</text>
  <text class="ts" x="56" y="265">8. 浅灰格子传感器基本看不见，标定只在 ① 那片无格白区做。</text>
  <text class="ts" x="56" y="270">9. 阵列仍是横着排的一排时，纸不能左右推，请改用竖版《五路测试纸-A4》。</text>

  <text class="txs" x="6" y="295">打印：A4 / 缩放 100% / 边距"无" / 关掉"适应页面"——一缩放，15 mm 的格子就不是 15 mm 了，整张表的答案全作废。</text>

</svg>
